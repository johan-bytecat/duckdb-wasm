version: "3.0"
services:
  # EMSDK 3.1.71 includes WASM64 (Memory64) support via WASM_MEMORY64=1.
  # Run wasm64 builds with: docker compose run --rm duckdb-wasm-ci make wasm64_dev
  duckdb-wasm-ci:
    image: duckdb/wasm-ci:0.76
    build:
      context: ./actions/image
      args:
        - GID=0
        - UID=0
    volumes:
      - .:/wd
      - ./.ccache:/mnt/ccache
      - ./.emscripten_cache:/mnt/emscripten_cache
    environment:
      - CCACHE_BASEDIR=/wd/lib
      - CCACHE_DIR=/mnt/ccache
      - EM_CACHE=/mnt/emscripten_cache/
